# Explicit project name: Compose otherwise derives it from the directory,
# so moving this folder would orphan the volumes and silently start a
# second, empty stack alongside the first.
name: invented_software

# Credentials come from .env, which is gitignored. ./start.sh generates it with
# random passwords on first run, and Compose picks it up automatically because
# it sits alongside this file. Nothing here carries a secret literal.
services:
  postgres:
    image: postgres:16-alpine
    container_name: invsw_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      # Loopback only. "5433:5432" binds 0.0.0.0, which puts the database on
      # the LAN and contradicts the security note in docs/operations.md.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
      - ./saas:/seed:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP. Without it pg_isready succeeds over the Unix
      # socket while the entrypoint's temporary init server is still running
      # db/init/*.sql, so Metabase could start before the metabase database
      # existed. The temp server does not listen on TCP, so this waits properly.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # dbt is not a service here: it runs on the host from .venv and connects to
  # the published port. Running it in a container would mean a second 400MB
  # image and a bind-mounted project for no benefit at this size.

  metabase:
    image: metabase/metabase:v0.50.21
    container_name: invsw_metabase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:?set in .env}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set in .env}
      MB_DB_HOST: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
