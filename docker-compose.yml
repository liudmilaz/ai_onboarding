# Credentials come from .env, which is gitignored. ./start.sh generates it with
# random passwords on first run, and Compose picks it up automatically because
# it sits alongside this file. Nothing here carries a secret literal.
services:
  postgres:
    image: postgres:16-alpine
    container_name: invsw_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
      - ./saas:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # dbt is not a service here: it runs on the host from .venv and connects to
  # the published port. Running it in a container would mean a second 400MB
  # image and a bind-mounted project for no benefit at this size.

  metabase:
    image: metabase/metabase:v0.50.21
    container_name: invsw_metabase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:?set in .env}
      MB_DB_PASS: ${POSTGRES_PASSWORD:?set in .env}
      MB_DB_HOST: postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  pgdata:
